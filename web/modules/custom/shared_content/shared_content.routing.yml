shared_content.refresh_all_feeds:
  path: '/admin/shared-content/refresh-aggregator-feeds'
  defaults:
    _controller: '\Drupal\shared_content\Controller\SharedContentController::refreshAllFeeds'
    _title: 'Refresh Aggregator Feeds'
  requirements:
    _permission: 'access content'
  options:
    _admin_route: TRUE
