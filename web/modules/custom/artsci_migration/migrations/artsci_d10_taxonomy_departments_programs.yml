id: artsci_d10_taxonomy_departments_programs
label: 'D10 departments_programs nodes -> D11 departments taxonomy terms'
migration_group: artsci_d10
migration_tags:
  - artsci_d10

source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  urls:
    - 'https://artsci.washu.edu/jsonapi/node/departments_programs?page[limit]=50&sort=drupal_internal__nid'
  headers:
    Accept: 'application/vnd.api+json'
  item_selector: data
  pager:
    type: urls
    selector: 'links/next/href'

  # Keyed on the D10 node's drupal_internal__nid so the person migration
  # (and any other migration referencing department nodes) can resolve
  # via migration_lookup using the source node id.
  ids:
    nid:
      type: integer

  fields:
    - name: nid
      label: 'D10 source NID'
      selector: 'attributes/drupal_internal__nid'
    - name: title
      label: Title
      selector: 'attributes/title'
    - name: langcode
      label: Language
      selector: 'attributes/langcode'
    - name: status
      label: Status
      selector: 'attributes/status'
    - name: path_alias
      label: 'Path alias'
      selector: 'attributes/path/alias'

process:
  # name is the required field on a taxonomy term.
  name: title
  langcode:
    plugin: default_value
    default_value: en
    source: langcode
  status:
    plugin: default_value
    default_value: 1
    source: status
  # Preserve the alias so outbound links to /department/foo keep resolving.
  # Drop or swap to pathauto if you'd rather regenerate.
  'path/alias': path_alias
  'path/pathauto':
    plugin: default_value
    default_value: 0

destination:
  plugin: 'entity:taxonomy_term'
  # VERIFY: change to whatever the actual vocab machine name is on D11.
  default_bundle: department

migration_dependencies:
  required: []
  optional: []
