id: artsci_d10_card_type_terms
label: 'Card Type taxonomy terms for image_card'
migration_group: artsci_d10
migration_tags:
  - artsci_d10

# Creates the two card_type vocabulary terms that the image_card node
# migrations reference via field_card_type. Uses embedded_data so the
# terms are part of the migration system (gets migrate_map entries) and
# can be looked up via migration_lookup by the keys
# 'departments_programs' and 'majors_minors'.
source:
  plugin: embedded_data
  data_rows:
    -
      key: departments_programs
      name: 'Departments & Programs'
    -
      key: majors_minors
      name: 'Majors & Minors'
  ids:
    key:
      type: string

process:
  vid:
    plugin: default_value
    default_value: card_type
  name: name
  langcode:
    plugin: default_value
    default_value: en
  status:
    plugin: default_value
    default_value: 1

destination:
  plugin: 'entity:taxonomy_term'
  default_bundle: card_type

migration_dependencies:
  required: []
  optional: []
