uuid: 1a4fee98-d850-4b84-9722-ae7bb5a797ce
langcode: en
status: true
dependencies:
  config:
    - filter.format.minimal
  module:
    - ckeditor5
format: minimal
editor: ckeditor5
settings:
  toolbar:
    items:
      - anchor
      - bold
      - underline
      - italic
      - alignment
      - numberedList
      - bulletedList
      - insertTable
      - superscript
      - subscript
      - '|'
      - link
      - '|'
      - blockQuote
      - '|'
      - drupalMedia
      - sourceEditing
      - '|'
      - heading
      - style
      - '|'
      - htmlEmbed
      - horizontalLine
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_paste_filter_pasteFilter:
      enabled: true
      filters:
        -
          enabled: true
          weight: -12
          search: '<span[^>]*>'
          replace: ''
        -
          enabled: true
          weight: -11
          search: '<\/span>'
          replace: ''
        -
          enabled: true
          weight: -10
          search: '(<[^>]*) (style="[^"]*")'
          replace: $1
        -
          enabled: true
          weight: -9
          search: '<font[^>]*>'
          replace: ''
        -
          enabled: true
          weight: -7
          search: '<\/font>'
          replace: ''
        -
          enabled: true
          weight: -6
          search: '<p>&nbsp;<\/p>'
          replace: ''
        -
          enabled: true
          weight: -5
          search: '<p><\/p>'
          replace: ''
        -
          enabled: false
          weight: -4
          search: '(<h([1-6])>)(.*?)(<\/h\2>)'
          replace: $1$3$4
        -
          enabled: true
          weight: -3
          search: '<o:p><\/o:p>'
          replace: ''
        -
          enabled: true
          weight: -2
          search: '(<[^>]*) (valign="[^"]*")'
          replace: $1
        -
          enabled: true
          weight: -8
          search: '(class="[^"]*")'
          replace: ''
        -
          enabled: true
          weight: -13
          search: '(<(h[1-6]|p)(?:\s+[^>]*?)?)(?:\s+class\s*=\s*([''"])[^''"]*\3)([^>]*>)'
          replace: ''
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<div class="lead alert alert--success alert--info alert--warning alert--danger">'
        - '<span role class="fa*">'
        - '<hr class>'
        - '<small class>'
        - '<blockquote cite>'
        - '<h2 id>'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<h6 id>'
        - '<a href hreflang title id target aria-label rel data-* class>'
    ckeditor5_style:
      styles:
        -
          label: 'Red Button'
          element: '<a class="bttn bttn--primary--reverse">'
        -
          label: 'Teal Button'
          element: '<a class="bttn bttn--secondary">'
        -
          label: 'Outline Button'
          element: '<a class="bttn bttn--primary">'
        -
          label: 'Add Red Arrow'
          element: '<a class="link--arrow--red">'
        -
          label: 'Add Arrow'
          element: '<a class="link--arrow">'
        -
          label: 'Add External Arrow'
          element: '<a class="link--external-arrow">'
        -
          label: 'Pre title'
          element: '<p class="pre-title">'
        -
          label: 'Intro Bold'
          element: '<p class="artsci-component--bold-intro">'
        -
          label: 'Intro Light'
          element: '<p class="artsci-component--light-intro">'
        -
          label: 'H2 Serif'
          element: '<h2 class="headline headline--serif">'
        -
          label: 'H2 Serif Underline'
          element: '<h2 class="headline headline--serif headline--underline">'
        -
          label: 'H3 Serif'
          element: '<h3 class="headline headline--serif">'
        -
          label: 'H3 Serif Underline'
          element: '<h3 class="headline headline--serif headline--underline">'
        -
          label: 'H4 Serif'
          element: '<h4 class="headline headline--serif">'
        -
          label: 'H4 Serif Underline'
          element: '<h4 class="headline headline--serif headline--underline">'
        -
          label: 'H5 Serif'
          element: '<h5 class="headline headline--serif">'
        -
          label: 'H5 Serif Underline'
          element: '<h5 class="headline headline--serif headline--underline">'
        -
          label: 'H6 Serif'
          element: '<h6 class="headline headline--serif">'
        -
          label: 'H6 Serif Underline'
          element: '<h6 class="headline headline--serif headline--underline">'
    editor_advanced_link_link:
      enabled_attributes: {  }
    media_media:
      allow_view_mode_override: true
image_upload:
  status: false
